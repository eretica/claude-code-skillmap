name: CI

on:
  push:
    branches: [main]
  pull_request:

# トークンは最小権限(チェックアウトの読み取りのみ)
permissions:
  contents: read

# 同一ブランチ/PRの古い実行はキャンセルして無駄を省く
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Build (local mode)
        run: npm run build
      - name: Build (cloud mode)
        run: npm run build:cloud
      - name: Unit tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome
      - name: E2E tests
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
